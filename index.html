<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magh Bihu Greetings</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff512f, #f09819, #ffd200);
        font-family: 'Noto Sans Assamese', sans-serif;
        text-align: center;
        color: #fff;
    }

    .container {
        padding: 20px;
    }

    .message {
        font-size: 2rem;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255,255,255,0.6);
        margin-bottom: 20px;
        line-height: 1.5;
    }

    video {
        width: 90%;
        max-width: 600px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    footer {
        margin-top: 15px;
        font-size: 1.2rem;
        color: #fff8dc;
        text-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    button {
        margin-top: 15px;
        padding: 10px 22px;
        font-size: 1rem;
        border: none;
        border-radius: 20px;
        background: #ffffff;
        color: #f09819;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    button:hover {
        background: #ffe8c2;
    }

    @media (max-width: 600px) {
        .message {
            font-size: 1.5rem;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="message">
        আপোনালৈ মাঘ বিহুৰ আন্তৰিক শুভেচ্ছা যাচিলোঁ...<br>
        আশাকৰোঁ আগন্তুক সময় আপোনাৰ সুখ শান্তিৰে ভৰপূৰ হওঁক।
    </div>

    <!-- Auto-playing muted video -->
    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Music Button -->
    <button onclick="playMusic()">▶️ Start Background Music</button>

    <footer>Happy Magh Bihu 🎉</footer>
</div>

<script>
function playMusic() {
    const music = document.getElementById('bgMusic');
    music.play();
}
</script>

</body>
</html>
