<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magh Bihu Greetings</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #1a1a40, #000015);
        font-family: 'Noto Sans Assamese', sans-serif;
        text-align: center;
        color: #ffffff;
    }

    .container {
        padding: 20px;
        background: rgba(255,255,255,0.08);
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(255,215,0,0.3);
        backdrop-filter: blur(6px);
    }

    .message {
        font-size: 2rem;
        font-weight: bold;
        color: #ffd700;
        text-shadow: 0 0 15px rgba(255,215,0,0.8);
        margin-bottom: 20px;
        line-height: 1.5;
    }

    video {
        width: 90%;
        max-width: 600px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    button {
        margin-top: 15px;
        padding: 10px 22px;
        font-size: 1rem;
        border: none;
        border-radius: 20px;
        background: #ffd700;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(255,215,0,0.6);
    }

    button:hover {
        background: #fff2a8;
    }

    footer {
        margin-top: 15px;
        font-size: 1.2rem;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    .watermark {
        margin-top: 8px;
        font-size: 0.9rem;
        color: rgba(255,255,255,0.5);
        letter-spacing: 1px;
    }

    @media (max-width: 600px) {
        .message {
            font-size: 1.4rem;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="message">
        ✨ আপোনালৈ মাঘ বিহুৰ আন্তৰিক শুভেচ্ছা ✨<br>
        আগন্তুক দিনসমূহ সুখ আৰু সমৃদ্ধিৰে ভৰপূৰ হওঁক।
    </div>

    <!-- Same Video -->
    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <!-- Background Music -->
    <audio id="bgMusic">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Play Button -->
    <button onclick="playMusic()">▶️ Play Background Music</button>

    <footer>🌙 Happy Magh Bihu 🌙</footer>
    <div class="watermark">Created by Ranjan</div>
</div>

<script>
function playMusic() {
    const music = document.getElementById('bgMusic');
    music.currentTime = 0;
    music.play();

    // Stop music after 1 minute
    setTimeout(() => {
        music.pause();
    }, 30000);
}
</script>

</body>
</html>
